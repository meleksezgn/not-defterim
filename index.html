function selected(t){if(view==='history')return t.done;if(t.hiddenFromPlan)return false;if(view==='inbox')return t.period==='inbox';if(t.period==='inbox')return false;if(view==='today')return t.period==='day'&&t.due&&t.due<=(selectedDate===today?today:selectedDate)&& (selectedDate===today||t.due===selectedDate);if(view==='week')return ['day','week'].includes(t.period)&&t.due&&weekOf(t.due)===weekOf(today);if(view==='month')return ['day','week','month'].includes(t.period)&&t.due&&t.due.slice(0,7)===today.slice(0,7);return false}
function taskHtml(t){if(t.period==='inbox')return `<div class="task row"><div class="copy"><div class="name">${esc(t.name)}</div>${t.note?`<p class="muted" style="white-space:pre-wrap">${esc(t.note)}</p>`:''}</div><button class="icon" data-edit="${esc(t.id)}">Düzenle / Planla</button><button class="icon" aria-label="Notu sil" data-delete="${esc(t.id)}">×</button></div>`;const g=state.goals.find(x=>x.id===t.goalId);return `<div class="task row ${t.done?'done':''}"><input type="checkbox" aria-label="${esc(t.name)} tamamlandı" data-toggle="${esc(t.id)}" ${t.done?'checked':''}><div class="copy"><div class="name">${t.priority?'★ ':''}${esc(t.name)}</div><div class="meta">${t.due?esc(t.due):'Tarihsiz'} ${!t.done&&t.due&&t.due<today?'<span class="danger"> · Gecikmiş</span>':''} ${g?' · '+esc(g.name):''}</div>${t.note?`<div class="meta">${esc(t.note)}</div>`:''}</div><button class="icon" data-edit="${esc(t.id)}">Düzenle</button><button class="icon" aria-label="Görevi sil" data-delete="${esc(t.id)}">×</button></div>`}
function goalHtml(g,full=false){const ts=state.tasks.filter(t=>t.goalId===g.id),done=ts.filter(t=>t.done).length,pct=ts.length?Math.round(done/ts.length*100):0;return `<div class="goal"><div class="row between"><strong>${esc(g.name)}</strong><span class="tag">%${pct}</span></div><div class="bar"><span style="width:${pct}%"></span></div><small>${done} / ${ts.length} adım tamamlandı${g.target?' · Hedef: '+esc(g.target):''}</small>${full?`<p>${esc(g.note)}</p><div class="row"><button data-step="${esc(g.id)}">＋ Adım ekle</button><button data-goaledit="${esc(g.id)}">Düzenle</button><button data-goaldelete="${esc(g.id)}" aria-label="Hedefi sil">×</button></div>${ts.map(taskHtml).join('')}`:''}</div>`}
function periodLabel(section,now=new Date()){
if(section==='today')return now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
if(section==='month')return now.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
if(section==='week'){const start=new Date(now);start.setDate(start.getDate()-(start.getDay()+6)%7);const end=new Date(start);end.setDate(end.getDate()+6);const month=d=>d.toLocaleDateString('tr-TR',{month:'long'});if(start.getFullYear()!==end.getFullYear())return `${start.getDate()} ${month(start)} ${start.getFullYear()} – ${end.getDate()} ${month(end)} ${end.getFullYear()} haftası`;if(start.getMonth()!==end.getMonth())return `${start.getDate()} ${month(start)} – ${end.getDate()} ${month(end)} haftası`;return `${start.getDate()}–${end.getDate()} ${month(end)} haftası`;}return ''}
function calendarHtml(){const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();let cells='<span></span>'.repeat(offset);for(let n=1;n<=count;n++){const date=day(new Date(year,month,n));const hasTask=state.tasks.some(t=>t.period==='day'&&t.due===date&&!t.done);cells+=`<button class="cal-day ${date===selectedDate?'chosen':''} ${date===today?'is-today':''} ${hasTask?'has-task':''}" data-caldate="${date}" aria-label="${n} ${esc(calendarMonth.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}))}" aria-pressed="${date===selectedDate}">${n}</button>`;}return `<div class="cal-top"><button data-calshift="-1" aria-label="Önceki ay">‹</button><strong>${esc(calendarMonth.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}))}</strong><button data-calshift="1" aria-label="Sonraki ay">›</button></div><div class="calendar">${['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(d=>`<span class="weekday">${d}</span>`).join('')}${cells}</div><button class="back-today" data-calnow="yes">Bugüne dön</button>`}
function renderPostit(){$('postit').innerHTML=`<div class="tape" aria-hidden="true"></div><div id="calendarArea">${calendarHtml()}</div><div class="postit-note"><label for="quickNote">Aklımdayken…</label><textarea id="quickNote" maxlength="5000" placeholder="Unutmadan buraya yaz…">${esc(noteDraft)}</textarea><button id="saveQuickNote">Notu bırak ＋</button><small>Aklımdakiler’e kaydedilir.</small></div>`}
function saveQuickNote(){const text=$('quickNote').value.trim();if(!text){$('quickNote').focus();return}const parts=text.split('\n'),first=parts.shift(),name=first.slice(0,240),note=[first.slice(240),...parts].filter(Boolean).join('\n');const ok=change(s=>s.tasks.push({id:uid(),name,note,period:'inbox',due:'',goalId:'',priority:false,done:false,completedAt:null,hiddenFromPlan:false}));if(ok){noteDraft='';try{localStorage.removeItem(KEY+'-draft')}catch{}renderPostit()}}

function moonPosition(now=new Date()){
const d=now.getTime()/86400000+2440587.5-2451545,rad=Math.PI/180,wrap=x=>(x%360+360)%360;
const sunMean=wrap(357.5291+.98560028*d),sun=wrap(280.46646+.98564736*d+1.9148*Math.sin(sunMean*rad)+.0200*Math.sin(2*sunMean*rad));
const l=wrap(218.316+13.176396*d),m=wrap(134.963+13.064993*d),elong=wrap(297.850+12.190749*d),f=wrap(93.272+13.229350*d);
const moon=wrap(l+6.289*Math.sin(m*rad)+1.274*Math.sin((2*elong-m)*rad)+.658*Math.sin(2*elong*rad)+.214*Math.sin(2*m*rad)-.186*Math.sin(sunMean*rad)-.114*Math.sin(2*f*rad));
const angle=wrap(moon-sun),fraction=(1-Math.cos(angle*rad))/2;
const names=['Yeni ay','Büyüyen hilal','İlk dördün','Büyüyen ay','Dolunay','Küçülen ay','Son dördün','Küçülen hilal'];return {angle,fraction,name:names[Math.floor((angle+22.5)/45)%8]}}
function moonPhase(now=new Date()){
const result=moonPosition(now),start=new Date(now);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);
const a=moonPosition(start).angle,b=moonPosition(end).angle;const span=(b-a+360)%360;const events=[[0,'Yeni ay'],[90,'İlk dördün'],[180,'Dolunay'],[270,'Son dördün']];
const event=events.find(([target])=>(target-a+360)%360<span);result.name=event?event[1]:result.angle<90?'Büyüyen hilal':result.angle<180?'Büyüyen ay':result.angle<270?'Küçülen ay':'Küçülen hilal';return result}
function moonHtml(){const moonDate=selectedDate===day()?new Date():new Date(selectedDate+'T12:00:00');const {angle,fraction,name}=moonPhase(moonDate);let bands='';const c=Math.cos(angle*Math.PI/180);for(let y=-48;y<48;y+=.6){const half=Math.sqrt(Math.max(0,48*48-y*y)),left=angle<180?c*half:-half,right=angle<180?half:-c*half;bands+=`<rect x="${60+left}" y="${60+y}" width="${Math.max(0,right-left)}" height=".8"/>`;}return `<div class="moon-widget" title="Seçilen tarihe göre yaklaşık astronomik evre; Kuzey Yarımküre görünümü"><span class="moon-pin" aria-hidden="true"></span><div class="moon-kicker">${moonDate.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div><svg viewBox="0 0 120 120" role="img" aria-label="${name}"><defs><clipPath id="moonDisc"><circle cx="60" cy="60" r="48"/></clipPath><radialGradient id="moonLight" cx="35%" cy="30%"><stop stop-color="#fff9e8"/><stop offset="1" stop-color="#c9c6b7"/></radialGradient></defs><circle cx="60" cy="60" r="48" fill="#37444c"/><g fill="url(#moonLight)" clip-path="url(#moonDisc)">${bands}</g><g clip-path="url(#moonDisc)" fill="#59635d" opacity=".12"><circle cx="43" cy="42" r="9"/><circle cx="74" cy="70" r="13"/><circle cx="36" cy="79" r="7"/><circle cx="77" cy="36" r="5"/><circle cx="58" cy="55" r="4"/></g><circle cx="60" cy="60" r="48" fill="none" stroke="#89958c" stroke-opacity=".25"/></svg><strong>${name}</strong></div>`}
function render(){ $('nav').innerHTML=Object.entries(defs).filter(([k])=>k!=='settings').concat([['settings',defs.settings]]).map(([k,v])=>`${k==='settings'?moonHtml():''}<button style="display:block;width:100%;margin:5px 0" class="${view===k?'active':''}" data-view="${k}" ${k==='settings'?`aria-label="Yedek kutusunu aç" aria-expanded="${view==='settings'}"`:``}>${k==='settings'?`<span class="box-art" aria-hidden="true"><svg class="blue-box" viewBox="0 0 160 110" width="160" height="110"><path d="M14 36 L130 43 L145 29 L29 22 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/><path d="M130 43 L145 29 L145 85 L130 101 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/><path d="M14 36 L130 43 L130 101 L17 93 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/><g class="svg-lid"><path d="M10 29 L129 36 L148 20 L29 13 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/><path d="M10 29 L129 36 L129 45 L10 38 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/><path d="M129 36 L148 20 L148 29 L129 45 Z" fill="#A3B7C6" stroke="#718899" stroke-width="1.5"/></g><path d="M25 65 L62 68 L62 84 L25 81 Z" fill="#FFF7E6"/><text x="29" y="77" font-size="10" fill="#2D3A47" transform="rotate(4 29 77)" font-family="Segoe UI,Arial,sans-serif">Yedek</text></svg></span>`:v[0]}</button>`).join('');$('title').hidden=true;$('subtitle').hidden=true;renderPostit();$('date').textContent=periodLabel(view,view==='today'?new Date(selectedDate+'T12:00:00'):new Date());$('date').hidden=!['today','week','month'].includes(view);$('title').textContent=defs[view][0];$('subtitle').textContent=defs[view][1];$('add').textContent=view==='goals'?'＋ Hedef ekle':view==='inbox'?'＋ Not ekle':'＋ Görev ekle';$('add').hidden=view==='settings';$('saved').textContent=storageOk?(state.updatedAt?'Son kayıt: '+new Date(state.updatedAt).toLocaleTimeString('tr-TR'):'Kayıt bu tarayıcıda tutulur'):'Kayıt okunamadı';
if(view==='settings'){$('content').innerHTML=`<section class="notebook"><div class="paper-heading"><h1>Yedek</h1></div><h3>Verilerin seninle kalsın</h3><p>Bu defter hesabına bağlı çevrimiçi kaydedilir. Bilgisayarında ve telefonunda aynı bağlantıyı aynı ChatGPT hesabıyla açabilirsin. Sağ altta Kaydedildi yazdığında değişikliklerin çevrimiçi saklanmıştır.</p><div class="toolbar"><button class="primary" id="backup">Yedek indir (.json)</button><button id="restore">Yedekten geri yükle</button></div><p class="muted">Yedek bütün hedeflerini ve görevlerini içerir. Cihaz değiştirmek için dosya taşıman gerekmez. İstersen ayrıca bir yedek kopya indirebilirsin.</p></section>`;return}
if(view==='goals'||view==='inbox'){const entries=view==='goals'?state.goals.map(g=>goalHtml(g,true)).join(''):state.tasks.filter(t=>t.period==='inbox').map(taskHtml).join('');$('content').innerHTML=`<section class="notebook" aria-label="${esc(defs[view][0])} defteri"><div class="paper-heading"><h1>${esc(view==='today'&&selectedDate!==today?'Günlük planım':defs[view][0])}</h1></div>${entries}</section>`;return}
let ts=state.tasks.filter(selected).filter(t=>filter!=='priority'||t.priority).sort((a,b)=>Number(b.priority)-Number(a.priority)||(a.due||'').localeCompare(b.due||''));const completed=state.tasks.filter(t=>t.done&&t.completedAt?.slice(0,10)===today).length;
$('content').innerHTML=`<section class="notebook" aria-label="${esc(defs[view][0])} defteri"><div class="paper-heading"><div class="row between"><h1>${esc(view==='today'&&selectedDate!==today?'Günlük planım':defs[view][0])}</h1><select id="filter" aria-label="Görev filtresi" style="width:auto;font-size:12px;background:#fffdf5"><option value="all">Tüm işler</option><option value="priority" ${filter==='priority'?'selected':''}>Öncelikliler</option></select></div></div>${ts.map(taskHtml).join('')}</section>${view!=='history'&&ts.some(t=>t.done)?'<div class="clear-row"><button id="clearCompleted">Tamamlananları kaldır</button></div>':''}`}

function openEditor(kind='task',id='',linked=''){mode=kind;$('form').reset();$('editId').value=id;$('taskFields').hidden=kind==='goal';$('goalFields').hidden=kind!=='goal';$('formTitle').textContent=(id?'Düzenle':kind==='goal'?'Yeni hedef':view==='inbox'?'Yeni not':'Yeni görev');$('goalId').innerHTML='<option value="">Bağımsız görev</option>'+state.goals.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');if(kind==='task'){const t=state.tasks.find(x=>x.id===id);$('period').value=view==='week'?'week':view==='month'?'month':view==='inbox'?'inbox':'day';$('due').value=view==='inbox'?'':view==='today'?selectedDate:today;$('goalId').value=linked;if(t){for(const f of ['name','note','period','due','goalId'])$(f).value=t[f];$('priority').checked=t.priority}}else{const g=state.goals.find(x=>x.id===id);if(g){$('name').value=g.name;$('note').value=g.note;$('target').value=g.target}}syncEditor();$('editor').showModal();$('name').focus()}
$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const id=$('editId').value||uid(),note=$('note').value.trim();if(mode==='task'&&$('period').value!=='inbox'&&!$('due').value){$('due').setCustomValidity('Plan için tarih seç.');$('due').reportValidity();return}const ok=change(s=>{const list=mode==='task'?s.tasks:s.goals,index=list.findIndex(x=>x.id===id),old=list[index];let item=mode==='task'?{id,name,note,period:$('period').value,due:$('period').value==='inbox'?'':$('due').value,goalId:$('period').value==='inbox'?'':$('goalId').value,priority:$('period').value==='inbox'?false:$('priority').checked,done:$('period').value==='inbox'?false:old?.done||false,completedAt:old?.completedAt||null,hiddenFromPlan:old?.hiddenFromPlan||false}:{id,name,note,target:$('target').value};if(index<0)list.push(item);else list[index]=item});if(ok)$('editor').close()};$('due').oninput=()=>$('due').setCustomValidity('');function syncEditor(){const isNote=mode==='task'&&$('period').value==='inbox';$('scheduleFields').hidden=isNote;document.querySelector('label[for=name]').textContent=isNote?'Not başlığı':mode==='goal'?'Hedefin':'Ne yapmak istiyorsun?';if(isNote)$('formTitle').textContent=$('editId').value?'Notu düzenle':'Yeni not'}
$('period').onchange=()=>{syncEditor();if($('period').value==='inbox')$('due').value='';else if(!$('due').value)$('due').value=today;$('due').setCustomValidity('')};$('close').onclick=$('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor(view==='goals'?'goal':'task');
function download(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Planim-yedek-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.calshift){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(d.calshift),1);$('calendarArea').innerHTML=calendarHtml();return}if(d.caldate){selectedDate=d.caldate;view='today';filter='all';render();return}if(d.calnow){selectedDate=today;calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);view='today';render();return}if(b.id==='saveQuickNote'){saveQuickNote();return}if(d.view){view=d.view;if(view==='today')selectedDate=today;filter='all';render()}if(d.edit)openEditor('task',d.edit);if(d.goaledit)openEditor('goal',d.goaledit);if(d.step)openEditor('task','',d.step);if(d.delete)change(s=>s.tasks=s.tasks.filter(t=>t.id!==d.delete));if(d.goaldelete)change(s=>{s.goals=s.goals.filter(g=>g.id!==d.goaldelete);s.tasks.forEach(t=>{if(t.goalId===d.goaldelete)t.goalId=''})});if(b.id==='quick'){openEditor();$('period').value='inbox';$('due').value='';syncEditor()}if(b.id==='clearCompleted'){change(s=>s.tasks.forEach(t=>{if(selected(t)&&t.done)t.hiddenFromPlan=true}))}if(b.id==='backup')download();if(b.id==='restore')$('restoreFile').click()});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){const id=e.target.dataset.toggle;change(s=>{const t=s.tasks.find(x=>x.id===id);t.done=!t.done;t.completedAt=t.done?today:null;if(!t.done)t.hiddenFromPlan=false})}if(e.target.id==='filter'){filter=e.target.value;render()}});
$('restoreFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error();const s=JSON.parse(await f.text());if(!valid(s))throw Error();if(confirm(`${s.tasks.length} görev ve ${s.goals.length} hedef yüklenecek. Mevcut kayıtların yerini alacak. Devam edilsin mi? (Önce mevcut yedeğini indirebilirsin.)`)){if(persist(s))toast('Yedek geri yüklendi.')}}catch(err){toast('Bu dosya geçerli bir Planım yedeği değil. Mevcut kayıtlar değiştirilmedi.')}e.target.value=''};
window.addEventListener('unused-local-storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;render()}}catch{}}});render();

setInterval(()=>{const widget=document.querySelector('.moon-widget');if(widget)widget.outerHTML=moonHtml()},60000);


async function notebookRequest(url,options={}){
 const response=(status,body)=>({status,ok:status>=200&&status<300,json:async()=>body});
 if(options.method==='PUT'){
   const payload=JSON.parse(options.body);
   const {data,error}=await db.from('notebooks').update({data:payload.state,revision:payload.revision+1,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('revision',payload.revision).select('revision');
   if(error)return response(500,{});
   if(data.length!==1)return response(409,{});
   return response(200,{revision:data[0].revision});
 }
 let {data,error}=await db.from('notebooks').select('data,revision').eq('user_id',user.id).maybeSingle();
 if(error)return response(500,{});
 if(!data){
   const empty={version:1,tasks:[],goals:[],updatedAt:null};
   const created=await db.from('notebooks').insert({user_id:user.id,data:empty,revision:0}).select('data,revision').single();
   if(created.error){
     if(created.error.code!=='23505')return response(500,{});
     const retry=await db.from('notebooks').select('data,revision').eq('user_id',user.id).single();
     if(retry.error)return response(500,{});
     data=retry.data;
   }else data=created.data;
 }
 return response(200,{state:data.data,revision:data.revision});
}

function syncText(text){$('syncStatus').textContent=text;$('syncStatus').hidden=text==='Çevrimiçi · Kaydedildi'}
function rememberPending(snapshot){try{localStorage.setItem(KEY+'-cloud-pending',JSON.stringify({revision,state:snapshot}))}catch{}}
function queueSave(snapshot){pendingCount++;rememberPending(snapshot);syncText('Kaydediliyor…');saveChain=saveChain.then(async()=>{if(syncConflict)throw Error('conflict');const response=await notebookRequest('/api/notebook',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state:snapshot})});if(response.status===409)throw Error('conflict');if(!response.ok)throw Error('network');const result=await response.json();revision=result.revision;pendingCount--;if(pendingCount===0){try{localStorage.removeItem(KEY+'-cloud-pending')}catch{}syncText('Çevrimiçi · Kaydedildi')}else rememberPending(state)}).catch(e=>{syncConflict=true;storageOk=false;rememberPending(state);syncText('Kaydedilmedi · Yedek indir');toast(e.message==='conflict'?'Diğer cihazda değişiklik var. Buradaki çalışmanı Yedek bölümünden indirip sayfayı yenile.':'Bağlantı kesildi. Buradaki çalışmanı Yedek bölümünden indirebilirsin. Bağlantı gelince sayfayı yenile.',true)});}
async function loadCloud(initial=false){if(pendingCount||syncConflict)return;const generation=editGeneration;try{const response=await notebookRequest('/api/notebook',{cache:'no-store'});if(!response.ok)throw Error();const result=await response.json();if(!valid(result.state))throw Error();if(pendingCount||generation!==editGeneration)return;if(initial||revision!==result.revision){state=result.state;revision=result.revision;cloudReady=true;storageOk=true;render()}syncText('Çevrimiçi · Kaydedildi');if(initial){let recovered;try{recovered=JSON.parse(localStorage.getItem(KEY+'-cloud-pending')||'null')}catch{}if(recovered&&valid(recovered.state)){if(JSON.stringify(recovered.state)===JSON.stringify(state)){localStorage.removeItem(KEY+'-cloud-pending')}else if(recovered.revision===revision){state=recovered.state;queueSave(JSON.parse(JSON.stringify(state)));render()}else{const backup=new Blob([JSON.stringify(recovered.state,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(backup);link.download='Not-defterim-kurtarma.json';link.textContent='Kaydedilmemiş kopyayı indir';link.style.cssText='margin-left:10px;color:inherit;text-decoration:underline';syncText('Önceki oturumdan kaydedilmemiş kopya var.');$('syncStatus').appendChild(link)}}}}catch{syncText('Bağlantı yok');if(initial)toast('Defter yüklenemedi. Bağlantını kontrol edip sayfayı yenile.',true)}}
$('signOut').onclick=async()=>{if(pendingCount||syncConflict){toast('Kaydedilmemiş değişikliklerin var. Önce Yedek bölümünden bir kopya indir.',true);return;}const {error}=await db.auth.signOut();if(error)toast('Çıkış yapılamadı. Bağlantını kontrol et.');};
window.addEventListener('beforeunload',e=>{if(pendingCount||syncConflict){e.preventDefault();e.returnValue='';}});
await loadCloud(true);setInterval(()=>{if(cloudReady&&!pendingCount&&!syncConflict&&!document.hidden&&!$('editor').open)loadCloud()},10000);window.addEventListener('focus',()=>{if(cloudReady&&!pendingCount&&!syncConflict&&!$('editor').open)loadCloud()});
}
